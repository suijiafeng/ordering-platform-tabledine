server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ordering-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordering}
    username: ${DB_USERNAME:ordering}
    password: ${DB_PASSWORD:ordering}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # 渠道调用是同步且有超时，单线程时一个任务卡住会拖住其他所有定时任务
        size: 4
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    customer-ttl: 2h
    staff-access-ttl: 2h
    staff-refresh-ttl: 14d
  auth:
    mock-enabled: false
    max-login-failures: 5
    lock-duration: 15m
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  pay:
    mock-enabled: false
    # 公网地址，用于拼接渠道异步通知 URL（/api/v1/pay/notify/*）
    notify-base-url: ${PAY_NOTIFY_BASE_URL:}
  wechat-pay:
    mch-id: ${WECHAT_PAY_MCH_ID:}
    serial-no: ${WECHAT_PAY_SERIAL_NO:}
    private-key: ${WECHAT_PAY_PRIVATE_KEY:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    platform-public-key-id: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_ID:}
    platform-public-key: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    # 公网地址的反向代理 / 云负载均衡需在此登记，否则其 X-Real-IP 不被信任，所有请求会被按同一 IP 限流
    trusted-proxies: ${TRUSTED_PROXIES:}
  qr:
    base-url: ${QR_BASE_URL:https://ordering.example.com/q/}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:/data/uploads}
    public-path: /uploads/
    serve-local: false
  rate-limit:
    enabled: true
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    store-name: ${BOOTSTRAP_STORE_NAME:}
    owner-username: ${BOOTSTRAP_OWNER_USERNAME:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
