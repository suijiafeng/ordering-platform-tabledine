server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ordering-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordering}
    username: ${DB_USERNAME:ordering}
    password: ${DB_PASSWORD:ordering}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        # 渠道调用是同步且有超时，单线程时一个任务卡住会拖住其他所有定时任务
        size: 4
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    member-ttl: 7d
    staff-access-ttl: 2h
    staff-refresh-ttl: 14d
  auth:
    max-login-failures: 5
    lock-duration: 15m
  refund:
    # 退款处理中超过该时长仍无结果，补偿任务按钱包流水查询并重试
    query-after: 3m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    # 公网地址的反向代理 / 云负载均衡需在此登记，否则其 X-Real-IP 不被信任，所有请求会被按同一 IP 限流
    trusted-proxies: ${TRUSTED_PROXIES:}
  qr:
    base-url: ${QR_BASE_URL:https://ordering.example.com/q/}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:/data/uploads}
    public-path: /uploads/
    serve-local: false
  rate-limit:
    enabled: true
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    store-name: ${BOOTSTRAP_STORE_NAME:}
    owner-username: ${BOOTSTRAP_OWNER_USERNAME:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
