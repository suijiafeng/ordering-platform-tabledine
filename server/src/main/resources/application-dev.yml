# 本地开发：docker compose 启动的 postgres + 种子数据（含测试会员）
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    # 仅开发环境使用，生产必须通过 JWT_SECRET 注入
    secret: ${JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
  qr:
    # 本机桌码直接打开 customer-web，并把桌码 token 传给 H5；真机扫码时用环境变量改为电脑的局域网地址。
    base-url: ${QR_BASE_URL:http://127.0.0.1:3000/h5/?token=}
  storage:
    local-dir: ./uploads
    serve-local: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:3000

logging:
  level:
    com.example.ordering: debug
