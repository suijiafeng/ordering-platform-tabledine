# 本地开发：只启动 PostgreSQL，后端和前端在本机运行
# docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordering
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ordering
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering -d ordering"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
