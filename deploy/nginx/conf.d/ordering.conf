# 将 ordering.example.com 替换为实际域名

# HTTP：证书签发校验 + 其余跳转 HTTPS
server {
    listen 80;
    server_name ordering.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ordering.example.com;

    ssl_certificate     /etc/letsencrypt/live/ordering.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordering.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 小程序平台的域名校验文件（微信/支付宝「普通二维码」规则要求放在域名根目录）
    location ~ ^/[A-Za-z0-9_-]+\.txt$ {
        root /usr/share/nginx/html;
    }

    # 桌码落地页：非微信/支付宝扫码时展示提示
    # 微信/支付宝扫码会直接打开小程序，不会请求到这里
    location /q/ {
        root /usr/share/nginx/html;
        try_files /q/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # 支付回调：放宽超时，关闭缓冲
    location /api/v1/pay/notify/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 菜品图片
    location /uploads/ {
        alias /data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket（V1 实时推送预留）
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 接口文档、监控端点不对公网开放
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        return 404;
    }

    # 商家端（SPA）
    location / {
        root /usr/share/nginx/merchant;
        try_files $uri /index.html;
    }
}
