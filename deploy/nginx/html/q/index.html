<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫码点餐</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f6f6f6; color: #222; }
    .box { max-width: 420px; margin: 20vh auto 0; padding: 32px 24px; background: #fff; border-radius: 16px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #666; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>请使用微信或支付宝扫码点餐</h1>
    <p>打开微信或支付宝的「扫一扫」，<br>重新扫描桌上的二维码即可进入点餐页面。</p>
  </div>
</body>
</html>
