name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # verify 包含 Checkstyle（validate 阶段）与测试；集成测试使用 Testcontainers，GitHub 托管的 ubuntu runner 自带 Docker
      - run: mvn -B verify
      # 验证后端生产镜像能构建（不推送）
      - run: docker build -t ordering-server:ci .

  merchant-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merchant-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: merchant-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-web-dist
          path: merchant-web/dist

  customer-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: customer-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 与生产部署一致：静态导出，产物与后端 API 同域部署
      - run: npm run build
        env:
          STATIC_EXPORT: 'true'

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 验证前端 / nginx 生产镜像能构建（在镜像里构建 merchant-web 与 customer-web）
      - run: docker build -f deploy/nginx/Dockerfile -t ordering-web:ci .
